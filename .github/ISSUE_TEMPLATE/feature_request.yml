name: Feature request
description: Propose a reader, command, or UX change
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a user not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - Claude Code
        - Cursor
        - Codex
        - All / foreign picker
        - New harness
        - Unsure
    validations:
      required: true
